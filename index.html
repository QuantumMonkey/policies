<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anubis Labs - App Policies</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-color: #00e5ff;
      --accent-gradient: linear-gradient(135deg, #00e5ff 0%, #0084ff 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-faint: #4b5563;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 229, 255, 0.08) 0, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 132, 255, 0.08) 0, transparent 50%);
      background-attachment: fixed;
    }

    /* Substrate Grid Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1040px;
      text-align: center;
      margin-bottom: 50px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: var(--accent-gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    .logo-icon svg {
      width: 28px;
      height: 28px;
      fill: #0b0f19;
    }

    .logo-text {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1040px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 320px));
      justify-content: center;
      gap: 24px;
      margin-bottom: 40px;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 30px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 229, 255, 0.3);
    }

    .project-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .project-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .project-logo-mini {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 4px;
    }

    .project-logo-mini svg {
      width: 100%;
      height: 100%;
      fill: var(--accent-color);
    }

    .project-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-link:hover {
      background: rgba(0, 229, 255, 0.05);
      border-color: rgba(0, 229, 255, 0.2);
    }

    .btn-link svg {
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      transition: fill 0.2s;
    }

    .btn-link:hover svg {
      fill: var(--accent-color);
    }

    .placeholder-card {
      border: 1px dashed var(--card-border);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-faint);
      padding: 40px;
    }

    .placeholder-card p {
      font-size: 0.95rem;
      font-weight: 600;
    }

    footer {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1040px;
      text-align: center;
      margin-top: 60px;
      color: var(--text-faint);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--accent-color);
    }

    @media (max-width: 600px) {
      body {
        padding: 40px 16px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon">
        <!-- Brand Mark (Three rising bars) -->
        <svg viewBox="0 0 1024 1024">
          <rect x="190" y="645" width="644" height="126" rx="63" />
          <rect x="260" y="449" width="504" height="126" rx="63" />
          <rect x="330" y="253" width="364" height="126" rx="63" />
        </svg>
      </div>
      <span class="logo-text">Anubis Labs</span>
    </div>
    <h1>Compliance Portal</h1>
    <p class="subtitle">Legal documentation, privacy policies, and terms of service for all Anubis Labs applications.</p>
  </header>

  <main>
    <div class="grid">
      
      <!-- Loadout Card -->
      <div class="project-card">
        <div class="project-info">
          <div class="project-title">
            <div class="project-logo-mini">
              <svg viewBox="0 0 1024 1024">
                <rect x="190" y="645" width="644" height="126" rx="63" />
                <rect x="260" y="449" width="504" height="126" rx="63" />
                <rect x="330" y="253" width="364" height="126" rx="63" />
              </svg>
            </div>
            Loadout
          </div>
          <p class="project-desc">An honest, offline-first gym &amp; nutrition tracker built for Indian lifters.</p>
        </div>
        <div class="links-list">
          <a href="loadout/privacy.html" class="btn-link">
            Privacy Policy
            <svg viewBox="0 0 24 24">
              <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42 5.43 5.43H5v2z"/>
            </svg>
          </a>
        </div>
      </div>



    </div>
  </main>

  <footer>
    <p>&copy; 2026 Anubis Labs. All rights reserved. <a href="https://github.com/QuantumMonkey" target="_blank">GitHub</a></p>
  </footer>

</body>
</html>
