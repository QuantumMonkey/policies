<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" role="img" aria-label="Loadout">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8FFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="498" height="198" rx="26" fill="#0A0B0D" stroke="#2A2E35"/>

  <!-- stacking mark: three bars rise + fade in sequence, looping -->
  <g transform="translate(74 100)">
    <rect x="-46" y="20" width="92" height="18" rx="9" fill="url(#accent)">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.85;1" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 34;0 0;0 0;0 34" keyTimes="0;0.2;0.85;1" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="-36" y="-8" width="72" height="18" rx="9" fill="url(#accent)">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.85;1" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 34;0 0;0 0;0 34" keyTimes="0;0.2;0.85;1" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-26" y="-36" width="52" height="18" rx="9" fill="#A3E635">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.85;1" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 34;0 0;0 0;0 34" keyTimes="0;0.2;0.85;1" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- wordmark -->
  <text x="168" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#F4F6F8" letter-spacing="-1">Loadout</text>
  <text x="170" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8A9099" letter-spacing="4">GYM · NUTRITION TRACKER</text>

  <!-- accent underline sweeps in, loops -->
  <rect x="170" y="142" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="0;290;290;0" keyTimes="0;0.25;0.85;1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
